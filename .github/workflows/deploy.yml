name: Deploy to cPanel

# Pushes to main deploy automatically. Run it by hand from the Actions tab
# ("Run workflow") to deploy any branch — manual runs default to a dry run,
# which only lists what WOULD be uploaded.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   FTP_SERVER      FTP host from cPanel > FTP Accounts ("FTP Server"), e.g. ftp.yourdomain.com
#   FTP_USERNAME    the FTP account's full username, e.g. deploy@yourdomain.com
#   FTP_PASSWORD    that account's password
#   FTP_SERVER_DIR  optional — folder to upload into, relative to where the FTP
#                   account lands. Defaults to public_html/ (right for the main
#                   cPanel account). Use / for an FTP account whose directory
#                   is already public_html.
#   FTP_SECURITY    optional — strict (default) checks the FTPS certificate;
#                   set loose when FTP_SERVER is the server IP (e.g. GoDaddy
#                   cPanel before the domain resolves), since the certificate
#                   is issued to the host's server name, not the IP.
#   FTP_PROTOCOL    optional — ftps (default, encrypted) or ftp if your host
#                   doesn't support FTPS.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (list changes without uploading)'
        type: boolean
        default: true

concurrency:
  group: deploy-cpanel
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      # Never ship a syntax error to the live site.
      - name: Lint PHP files
        run: |
          find . -name '*.php' -not -path './theme/*' -print0 | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Upload changed files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftps' }}
          security: ${{ secrets.FTP_SECURITY || 'strict' }}
          port: 21
          local-dir: ./
          server-dir: ${{ secrets.FTP_SERVER_DIR || 'public_html/' }}
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          # Setting `exclude` replaces the action's defaults, so those are repeated first.
          # Real config files (gitignored anyway) are created on the server by
          # hand; the committed config/*.example.php files ARE uploaded, since
          # includes/functions.php falls back to them until then.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .claude/**
            theme/**
            database/**
            *.sql
            *.md
            config/database.php
            config/sms.php
            config/email.php
            config/gemini.php
            config/gdrive.php
            uploads/basics_products/**
